name: RaceDay CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore RaceDay.sln
      - run: dotnet build RaceDay.sln --no-restore -c Release
      - run: dotnet test RaceDay.sln --no-build -c Release --verbosity normal
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: raceday-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong@Password123!"
    ports:
      - "1433:1433"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: RaceDay.API/Dockerfile
    container_name: raceday-api
    depends_on:
      - db
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__DefaultConnection: ${SQL_CONNECTION_STRING}
      AzureBlob__ConnectionString: ${AZURE_STORAGE_CONNECTION_STRING}
    restart: unless-stopped

  mvc:
    build:
      context: .
      dockerfile: RaceDay.MVC/Dockerfile
    container_name: raceday-mvc
    depends_on:
      - api
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      ApiSettings__BaseUrl: http://api:8080/
    restart: unless-stopped